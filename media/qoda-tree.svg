<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc"><title id="title">Worked QODA quality tree</title><desc id="desc">Quality branches into Performance, Availability and Maintainability. Performance splits into Search and Export. Leaf weights are products of local path weights.</desc><rect width="900" height="350" fill="#f7f6ef"/><g stroke="#39745b" stroke-width="2" fill="none"><path d="M450 68V84H240V108M450 84H560V108M450 84H770V108M240 168V194H120V220M240 194H340V220M560 168V220M770 168V220"/></g><rect x="350" y="8" width="200" height="60" rx="8" fill="#e2ede3" stroke="#39745b"/><text x="450.0" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#173d30">Quality</text><text x="450.0" y="53" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#173d30">New campus example</text><rect x="140" y="108" width="200" height="60" rx="8" fill="#e2ede3" stroke="#39745b"/><text x="240.0" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#173d30">Performance</text><text x="240.0" y="153" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#173d30">Rank 1 · 11/18</text><rect x="460" y="108" width="200" height="60" rx="8" fill="#e2ede3" stroke="#39745b"/><text x="560.0" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#173d30">Availability</text><text x="560.0" y="153" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#173d30">Rank 2 · 5/18</text><rect x="670" y="108" width="200" height="60" rx="8" fill="#e2ede3" stroke="#39745b"/><text x="770.0" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#173d30">Maintainability</text><text x="770.0" y="153" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#173d30">Rank 3 · 1/9</text><rect x="20" y="220" width="200" height="60" rx="8" fill="#e2ede3" stroke="#39745b"/><text x="120.0" y="244" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#173d30">Search · local 3/4</text><text x="120.0" y="265" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#173d30">11/24 ≈ 0.4583</text><rect x="240" y="220" width="200" height="60" rx="8" fill="#e2ede3" stroke="#39745b"/><text x="340.0" y="244" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#173d30">Export · local 1/4</text><text x="340.0" y="265" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#173d30">11/72 ≈ 0.1528</text><rect x="460" y="220" width="200" height="60" rx="8" fill="#e2ede3" stroke="#39745b"/><text x="560.0" y="244" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#173d30">Worker loss · local 1</text><text x="560.0" y="265" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#173d30">5/18 ≈ 0.2778</text><rect x="670" y="220" width="200" height="60" rx="8" fill="#e2ede3" stroke="#39745b"/><text x="770.0" y="244" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#173d30">New source · local 1</text><text x="770.0" y="265" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#173d30">1/9 ≈ 0.1111</text><text x="450" y="323" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#173d30">Multiply along each path. All four leaf weights sum to 1.</text></svg>